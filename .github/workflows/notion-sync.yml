name: 🔄 깃허브 프로젝트 → 노션 보드 동기화

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "점검만 실행 (Notion을 변경하지 않음)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: notion-project-sync
  cancel-in-progress: false

jobs:
  # GitHub Projects → Notion 동기화
  sync:
    name: 🧭 깃허브 이슈 → 노션 보드
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # GitHub App 토큰 발급
      - name: 🔐 깃허브 앱 인증 토큰 발급
        id: github-app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: sideproject2
          repositories: |
            workflow
            infrastructure
            backend
            frontend

      # GitHub Projects 이슈를 Notion에 동기화
      - name: 📋 프로젝트 이슈 노션 반영
        id: notion-sync
        uses: actions/github-script@v8
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        with:
          github-token: ${{ steps.github-app.outputs.token }}

          script: |
            // GitHub Projects와 Notion 동기화 설정
            const ORG = 'sideproject2';

            const PROJECTS = [
              { number: 1, area: '⚙️ 백엔드' },
              { number: 3, area: '🖥️ 프론트엔드' }
            ];

            const ALLOWED_REPOSITORIES = new Set([
              'sideproject2/workflow',
              'sideproject2/infrastructure',
              'sideproject2/backend',
              'sideproject2/frontend'
            ]);

            // GitHub 로그인과 Notion 담당자 표시 이름 매핑
            const ASSIGNEE_NAMES = {
              'minzx23': '🐿️ 강민주',
              'seul15': '🐣 이슬',
              'WhiteBin-bin': '🐯 백현빈',
              'sooloin': '🐧 조수빈',
              'Anchovia': '🐉 전병훈',
              'KJK1023': '🧙🏻‍♂️ 김재균',
            };

            const ASSIGNEE_COLORS = {
              '🐿️ 강민주': 'purple',
              '🐣 이슬': 'yellow',
              '🐯 백현빈': 'orange',
              '🐧 조수빈': 'gray',
              '🐉 전병훈': 'green',
              '🧙🏻‍♂️ 김재균': 'blue',
            };

            const TYPE_COLORS = {
              '⚙️ Chore': 'gray',
              '✨ Feature': 'yellow',
              '🐛 Bug': 'green',
              '🐳 DevOps': 'blue',
              '👑 MVP': 'red',
              '📚 Docs': 'purple',
              '🔒 Security': 'gray',
              '🔥 2차 기능': 'orange',
              '🛠 Refactor': 'gray',
              '🧪 Test': 'green',
              '🧹 Style': 'orange',
              '🎨 Design': 'purple',
              '🐿️ 강민주': 'purple',
              '🐣 이슬': 'yellow',
              '🐯 백현빈': 'orange',
              '🐧 조수빈': 'gray',
              '🐉 전병훈': 'green',
              '🧙🏻‍♂️ 김재균': 'blue'
            };

            const AREA_COLORS = {
              '⚙️ 백엔드': 'default',
              '🖥️ 프론트엔드': 'blue',
              '📑 기획': 'brown',
              '🎨 디자인': 'purple',
            };

            const MANAGEMENT_COLORS = {
              '🔗 GitHub 연동': 'purple',
              '📝 직접 관리': 'gray',
            };

            const VERSION = '2026-03-11';

            const token = process.env.NOTION_API_TOKEN;
            const sourceId = process.env.NOTION_DATA_SOURCE_ID;
            const dryRun = process.env.DRY_RUN === 'true';

            if (!token || !sourceId) {
              throw new Error(
                'NOTION_API_TOKEN / NOTION_DATA_SOURCE_ID Secret을 확인하세요.'
              );
            }

            const pause = ms =>
              new Promise(resolve => setTimeout(resolve, ms));

            const normalize = value =>
              String(value)
                .replaceAll(',', '，')
                .slice(0, 100);

            const text = value =>
              value
                ? [{
                    type: 'text',
                    text: {
                      content: String(value).slice(0, 2000)
                    }
                  }]
                : [];

            const select = value => ({
              select: value
                ? {
                    name: normalize(value)
                  }
                : null
            });

            const rich = property =>
              (property?.rich_text || [])
                .map(
                  x =>
                    x.plain_text ??
                    x.text?.content ??
                    ''
                )
                .join('');

            const warnings = new Set();

            async function notion(
              path,
              method = 'GET',
              body
            ) {
              for (
                let attempt = 0;
                attempt < 5;
                attempt++
              ) {
                await pause(350);

                const response = await fetch(
                  `https://api.notion.com/v1${path}`,
                  {
                    method,
                    headers: {
                      Authorization: `Bearer ${token}`,
                      'Notion-Version': VERSION,
                      'Content-Type': 'application/json'
                    },
                    ...(
                      body === undefined
                        ? {}
                        : {
                            body: JSON.stringify(body)
                          }
                    ),
                    signal:
                      AbortSignal.timeout(30000),
                  }
                );

                const retryable =
                  response.status === 429 ||
                  (
                    response.status >= 500 &&
                    !(
                      method === 'POST' &&
                      path === '/pages'
                    )
                  );

                if (
                  retryable &&
                  attempt < 4
                ) {
                  await pause(
                    Math.max(
                      1,
                      Number(
                        response.headers.get(
                          'retry-after'
                        )
                      ) ||
                        2 ** attempt
                    ) * 1000
                  );

                  continue;
                }

                const result =
                  await response.json();

                if (!response.ok) {
                  throw new Error(
                    `Notion ${response.status}: ${
                      result.message ||
                      result.code
                    }`
                  );
                }

                return result;
              }
            }

            const fieldFragments = `
              ... on ProjectV2SingleSelectField {
                name
                options {
                  name
                  color
                }
              }

              ... on ProjectV2Field {
                name
                dataType
              }

              ... on ProjectV2IterationField {
                name
              }
            `;

            async function readProject(config) {
              const fields = [];

              let cursor = null;
              let title;

              do {
                const result =
                  await github.graphql(
                    `query(
                      $org:String!,
                      $number:Int!,
                      $cursor:String
                    ) {
                      organization(login:$org) {
                        projectV2(number:$number) {
                          title

                          fields(
                            first:100,
                            after:$cursor
                          ) {
                            nodes {
                              ${fieldFragments}
                            }

                            pageInfo {
                              hasNextPage
                              endCursor
                            }
                          }
                        }
                      }
                    }`,
                    {
                      org: ORG,
                      number: config.number,
                      cursor
                    }
                  );

                const project =
                  result.organization
                    ?.projectV2;

                if (!project) {
                  throw new Error(
                    `프로젝트 #${config.number} 접근 불가. 앱의 Organization Projects 권한을 확인하세요.`
                  );
                }

                title = project.title;

                fields.push(
                  ...project.fields.nodes
                );

                cursor =
                  project.fields.pageInfo
                    .hasNextPage
                    ? project.fields
                        .pageInfo
                        .endCursor
                    : null;

              } while (cursor);

              for (
                const name of [
                  'Status',
                  '우선순위',
                  '작업량',
                  '시작일',
                  '종료일',
                  '스프린트'
                ]
              ) {
                if (
                  !fields.some(
                    field =>
                      field.name === name
                  )
                ) {
                  throw new Error(
                    `프로젝트 #${config.number}: 필드 "${name}"가 없습니다. 필드 이름을 확인하세요.`
                  );
                }
              }

              for (
                const name of [
                  'Status',
                  '우선순위',
                  '작업량'
                ]
              ) {
                if (
                  !Array.isArray(
                    fields.find(
                      field =>
                        field.name === name
                    )?.options
                  )
                ) {
                  throw new Error(
                    `${name}: GitHub 필드는 Single select여야 합니다.`
                  );
                }
              }

              const items = [];

              do {
                const result =
                  await github.graphql(
                    `query(
                      $org:String!,
                      $number:Int!,
                      $cursor:String
                    ) {
                      organization(login:$org) {
                        projectV2(number:$number) {
                          items(
                            first:50,
                            after:$cursor
                          ) {
                            nodes {
                              id
                              isArchived

                              status:
                                fieldValueByName(
                                  name:"Status"
                                ) {
                                  ... on ProjectV2ItemFieldSingleSelectValue {
                                    name
                                  }
                                }

                              priority:
                                fieldValueByName(
                                  name:"우선순위"
                                ) {
                                  ... on ProjectV2ItemFieldSingleSelectValue {
                                    name
                                  }
                                }

                              size:
                                fieldValueByName(
                                  name:"작업량"
                                ) {
                                  ... on ProjectV2ItemFieldSingleSelectValue {
                                    name
                                  }
                                }

                              start:
                                fieldValueByName(
                                  name:"시작일"
                                ) {
                                  ... on ProjectV2ItemFieldDateValue {
                                    date
                                  }
                                }

                              end:
                                fieldValueByName(
                                  name:"종료일"
                                ) {
                                  ... on ProjectV2ItemFieldDateValue {
                                    date
                                  }
                                }

                              sprint:
                                fieldValueByName(
                                  name:"스프린트"
                                ) {
                                  ... on ProjectV2ItemFieldIterationValue {
                                    title
                                  }

                                  ... on ProjectV2ItemFieldTextValue {
                                    text
                                  }

                                  ... on ProjectV2ItemFieldSingleSelectValue {
                                    name
                                  }
                                }

                              content {
                                __typename

                                ... on Issue {
                                  title
                                  number
                                  url

                                  repository {
                                    nameWithOwner
                                  }

                                  labels(first:100) {
                                    nodes {
                                      name
                                    }

                                    pageInfo {
                                      hasNextPage
                                    }
                                  }

                                  assignees(first:100) {
                                    nodes {
                                      login
                                    }

                                    pageInfo {
                                      hasNextPage
                                    }
                                  }
                                }
                              }
                            }

                            pageInfo {
                              hasNextPage
                              endCursor
                            }
                          }
                        }
                      }
                    }`,
                    {
                      org: ORG,
                      number: config.number,
                      cursor
                    }
                  );

                const project =
                  result.organization
                    ?.projectV2;

                if (!project) {
                  throw new Error(
                    `프로젝트 #${config.number} 조회 실패`
                  );
                }

                items.push(
                  ...project.items.nodes
                );

                cursor =
                  project.items.pageInfo
                    .hasNextPage
                    ? project.items
                        .pageInfo
                        .endCursor
                    : null;

              } while (cursor);

              return {
                ...config,
                title,
                fields,
                items
              };
            }

            function propertiesFor(
              item,
              project
            ) {
              const issue = item.content;

              if (
                issue.labels.pageInfo
                  .hasNextPage ||
                issue.assignees.pageInfo
                  .hasNextPage
              ) {
                throw new Error(
                  '이슈의 라벨 또는 담당자가 100개를 넘습니다. 잘린 데이터를 저장하지 않습니다.'
                );
              }

              if (
                !ALLOWED_REPOSITORIES.has(
                  issue.repository
                    .nameWithOwner
                    .toLowerCase()
                )
              ) {
                throw new Error(
                  `허용되지 않은 저장소: ${issue.repository.nameWithOwner}`
                );
              }

              const names =
                issue.assignees.nodes.map(
                  x =>
                    ASSIGNEE_NAMES[
                      x.login
                    ] ||
                    x.login
                );

              const props = {
                '이름': {
                  title:
                    text(issue.title)
                },

                '상태':
                  select(
                    item.status?.name
                  ),

                '우선순위':
                  select(
                    item.priority?.name
                  ),

                '작업량':
                  select(
                    item.size?.name
                  ),

                '시작일': {
                  date:
                    item.start?.date
                      ? {
                          start:
                            item.start
                              .date
                        }
                      : null
                },

                '종료일': {
                  date:
                    item.end?.date
                      ? {
                          start:
                            item.end.date
                        }
                      : null
                },

                '스프린트': {
                  rich_text:
                    text(
                      item.sprint
                        ?.title ||
                      item.sprint
                        ?.text ||
                      item.sprint
                        ?.name
                    )
                },

                '유형': {
                  multi_select:
                    [
                      ...new Set(
                        issue.labels.nodes.map(
                          x =>
                            normalize(
                              x.name
                            )
                        )
                      )
                    ]
                      .sort()
                      .map(
                        name => ({
                          name
                        })
                      )
                },

                '영역':
                  select(project.area),

                '관리 방식':
                  select(
                    '🔗 GitHub 연동'
                  ),

                '관련 자료': {
                  url: issue.url
                },

                'Issue 번호': {
                  number:
                    issue.number
                },

                'Project Item ID': {
                  rich_text:
                    text(item.id)
                },
              };

              if (
                names.length <= 1
              ) {
                props['담당자'] =
                  select(names[0]);
              } else {
                warnings.add(
                  `${issue.repository.nameWithOwner}#${issue.number}: 담당자가 여러 명이라 선택 속성에 저장하지 않았습니다. 기존 담당자 값은 유지합니다.`
                );
              }

              return props;
            }

            function canonical(
              property,
              type
            ) {
              const value =
                property?.[type];

              if (
                type === 'title' ||
                type === 'rich_text'
              ) {
                return (
                  value || []
                )
                  .map(
                    x =>
                      x.plain_text ??
                      x.text
                        ?.content ??
                      ''
                  )
                  .join('');
              }

              if (
                type === 'select'
              ) {
                return (
                  value?.name ||
                  null
                );
              }

              if (
                type ===
                'multi_select'
              ) {
                return (
                  value || []
                )
                  .map(
                    x => x.name
                  )
                  .sort();
              }

              if (
                type === 'date'
              ) {
                return value
                  ? [
                      value.start,
                      value.end ||
                        null
                    ]
                  : null;
              }

              return value ?? null;
            }

            function changed(
              page,
              props
            ) {
              return Object.entries(
                props
              ).some(
                ([
                  name,
                  property
                ]) => {
                  const type =
                    Object.keys(
                      property
                    )[0];

                  return (
                    JSON.stringify(
                      canonical(
                        page.properties[
                          name
                        ],
                        type
                      )
                    ) !==
                    JSON.stringify(
                      canonical(
                        property,
                        type
                      )
                    )
                  );
                }
              );
            }

            const projects = [];

            for (
              const config of PROJECTS
            ) {
              projects.push(
                await readProject(
                  config
                )
              );
            }

            const expected =
              new Map();

            let skipped = 0;

            for (
              const project of projects
            ) {
              for (
                const item of project.items
              ) {
                if (
                  !item.content ||
                  item.content
                    .__typename ===
                    'RedactedItem'
                ) {
                  throw new Error(
                    `프로젝트 #${project.number}: 읽을 수 없는 아이템이 있습니다. 앱의 저장소 접근 권한을 확인하세요.`
                  );
                }

                if (
                  item.isArchived ||
                  item.content
                    .__typename !==
                    'Issue'
                ) {
                  skipped++;
                  continue;
                }

                expected.set(
                  item.id,
                  propertiesFor(
                    item,
                    project
                  )
                );
              }

              console.log(
                `프로젝트 #${project.number} → ${project.area}: ${project.items.length}개 아이템 조회`
              );
            }

            const schema =
              await notion(
                `/data_sources/${sourceId}`
              );

            const required = {
              '이름': 'title',
              '상태': 'select',
              '우선순위': 'select',
              '작업량': 'select',
              '시작일': 'date',
              '종료일': 'date',
              '스프린트': 'rich_text',
              '담당자': 'select',
              '유형': 'multi_select',
              '영역': 'select',
              '관리 방식': 'select',
              '관련 자료': 'url',
              'Issue 번호': 'number',
              'Project Item ID': 'rich_text',
              '동기화 일시': 'date',
            };

            for (
              const [
                name,
                type
              ] of Object.entries(
                required
              )
            ) {
              if (
                schema.properties?.[
                  name
                ]?.type !== type
              ) {
                throw new Error(
                  `Notion 속성 "${name}"는 ${type} 타입이어야 합니다. 현재: ${
                    schema.properties?.[
                      name
                    ]?.type ||
                    '없음'
                  }`
                );
              }
            }

            const existing =
              new Map();

            let cursor = null;

            do {
              const page =
                await notion(
                  `/data_sources/${sourceId}/query`,
                  'POST',
                  {
                    page_size: 100,

                    filter: {
                      property:
                        'Project Item ID',

                      rich_text: {
                        is_not_empty:
                          true
                      }
                    },

                    ...(
                      cursor
                        ? {
                            start_cursor:
                              cursor
                          }
                        : {}
                    ),
                  }
                );

              for (
                const row of page.results
              ) {
                const id =
                  rich(
                    row.properties[
                      'Project Item ID'
                    ]
                  );

                if (
                  existing.has(id)
                ) {
                  throw new Error(
                    `Notion에 같은 Project Item ID가 중복되어 있습니다: ${id}`
                  );
                }

                existing.set(
                  id,
                  row
                );
              }

              cursor =
                page.has_more
                  ? page.next_cursor
                  : null;

            } while (cursor);

            const desiredOptions = {};

            function addOption(
              property,
              name,
              color
            ) {
              if (!name) return;

              desiredOptions[
                property
              ] ||= new Map();

              const safeColor =
                [
                  'blue',
                  'gray',
                  'green',
                  'orange',
                  'pink',
                  'purple',
                  'red',
                  'yellow',
                  'brown'
                ].includes(
                  String(
                    color
                  ).toLowerCase()
                )
                  ? String(
                      color
                    ).toLowerCase()
                  : 'default';

              desiredOptions[
                property
              ].set(
                normalize(name),
                {
                  name:
                    normalize(
                      name
                    ),
                  color:
                    safeColor
                }
              );
            }

            for (
              const project of projects
            ) {
              for (
                const [
                  from,
                  to
                ] of [
                  [
                    'Status',
                    '상태'
                  ],
                  [
                    '우선순위',
                    '우선순위'
                  ],
                  [
                    '작업량',
                    '작업량'
                  ]
                ]
              ) {
                for (
                  const option of project.fields.find(
                    x =>
                      x.name ===
                      from
                  ).options
                ) {
                  addOption(
                    to,
                    option.name,
                    option.color
                  );
                }
              }
            }

            for (
              const [
                name,
                color
              ] of Object.entries(
                AREA_COLORS
              )
            ) {
              addOption(
                '영역',
                name,
                color
              );
            }

            for (
              const [
                name,
                color
              ] of Object.entries(
                MANAGEMENT_COLORS
              )
            ) {
              addOption(
                '관리 방식',
                name,
                color
              );
            }

            for (
              const [
                name,
                color
              ] of Object.entries(
                TYPE_COLORS
              )
            ) {
              addOption(
                '유형',
                name,
                color
              );
            }

            for (
              const props of expected.values()
            ) {
              if (
                props['담당자']
                  ?.select
              ) {
                const assignee =
                  props[
                    '담당자'
                  ].select.name;

                addOption(
                  '담당자',
                  assignee,
                  ASSIGNEE_COLORS[
                    assignee
                  ]
                );
              }

              for (
                const option of props[
                  '유형'
                ].multi_select
              ) {
                addOption(
                  '유형',
                  option.name,
                  TYPE_COLORS[
                    option.name
                  ]
                );
              }
            }

            const optionPatch = {};

            for (
              const [
                name,
                options
              ] of Object.entries(
                desiredOptions
              )
            ) {
              const type =
                required[name];

              const current =
                schema.properties[
                  name
                ][type].options;

              const currentNames =
                new Set(
                  current.map(
                    x => x.name
                  )
                );

              const missing =
                [
                  ...options.values()
                ].filter(
                  x =>
                    !currentNames.has(
                      x.name
                    )
                );

              if (
                missing.length
              ) {
                optionPatch[
                  name
                ] = {
                  [type]: {
                    options: [
                      ...current.map(
                        x => ({
                          id: x.id
                        })
                      ),
                      ...missing
                    ]
                  }
                };
              }
            }

            if (
              Object.keys(
                optionPatch
              ).length &&
              !dryRun
            ) {
              await notion(
                `/data_sources/${sourceId}`,
                'PATCH',
                {
                  properties:
                    optionPatch
                }
              );
            }

            let created = 0;
            let updated = 0;
            let unchanged = 0;
            let protectedCount = 0;

            for (
              const [
                id,
                props
              ] of expected
            ) {
              const row =
                existing.get(id);

              const mode =
                row?.properties[
                  '관리 방식'
                ]?.select?.name;

              if (
                row &&
                mode &&
                ![
                  'GitHub 연동',
                  '🔗 GitHub 연동'
                ].includes(mode)
              ) {
                protectedCount++;
                continue;
              }

              if (
                row &&
                !changed(
                  row,
                  props
                )
              ) {
                unchanged++;
                continue;
              }

              if (row) {
                updated++;
              } else {
                created++;
              }

              if (dryRun) {
                continue;
              }

              const properties = {
                ...props,

                '동기화 일시': {
                  date: {
                    start:
                      new Date()
                        .toISOString()
                  }
                }
              };

              if (row) {
                await notion(
                  `/pages/${row.id}`,
                  'PATCH',
                  {
                    properties
                  }
                );
              } else {
                await notion(
                  '/pages',
                  'POST',
                  {
                    parent: {
                      type:
                        'data_source_id',

                      data_source_id:
                        sourceId
                    },

                    properties
                  }
                );
              }
            }

            for (
              const warning of warnings
            ) {
              core.warning(
                warning
              );
            }

            const retained =
              [
                ...existing.keys()
              ].filter(
                id =>
                  !expected.has(id)
              ).length;

            await core.summary
              .addHeading(
                dryRun
                  ? 'GitHub → Notion 점검 결과 (변경 없음)'
                  : 'GitHub → Notion 동기화 결과'
              )
              .addTable([
                [
                  {
                    data: '항목',
                    header: true
                  },
                  {
                    data: '개수',
                    header: true
                  }
                ],

                [
                  '현재 대상 이슈',
                  String(
                    expected.size
                  )
                ],

                [
                  '생성 / 생성 예정',
                  String(created)
                ],

                [
                  '수정 / 수정 예정',
                  String(updated)
                ],

                [
                  '변경 없음',
                  String(
                    unchanged
                  )
                ],

                [
                  '직접 관리 등 보호',
                  String(
                    protectedCount
                  )
                ],

                [
                  '원본 대상에서 빠져 유지한 기존 카드',
                  String(retained)
                ],

                [
                  '보관됨 / PR / 초안 제외',
                  String(skipped)
                ],

                [
                  '담당자 경고',
                  String(
                    warnings.size
                  )
                ],
              ])
              .addRaw(
                '\n프로젝트 #1: 백엔드 / #3: 프론트엔드. 카드 자동 삭제 없음.\n'
              )
              .write();

      # 두 단계의 실행 결과를 Discord에 전송
      - name: 📣 디스코드 실행 결과 알림
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_APP_OUTCOME: ${{ steps.github-app.outcome }}
          NOTION_SYNC_OUTCOME: ${{ steps.notion-sync.outcome }}
        run: |
          status_line() {
            case "$1" in
              success) echo "✅ $2" ;;
              failure) echo "❌ $2" ;;
              cancelled) echo "⚠️ $2" ;;
              skipped) echo "⏭️ $2" ;;
              *) echo "⚪ $2 ($1)" ;;
            esac
          }

          if [ "$GITHUB_APP_OUTCOME" = "cancelled" ] || [ "$NOTION_SYNC_OUTCOME" = "cancelled" ]; then
            TITLE="⚠️ GitHub → Notion 동기화 취소"
            COLOR=16776960
          elif [ "$GITHUB_APP_OUTCOME" = "success" ] && [ "$NOTION_SYNC_OUTCOME" = "success" ]; then
            TITLE="✅ GitHub → Notion 동기화 성공"
            COLOR=5763719
          else
            TITLE="❌ GitHub → Notion 동기화 실패"
            COLOR=15548997
          fi

          GITHUB_APP_STATUS="$(status_line "$GITHUB_APP_OUTCOME" "깃허브 앱 인증 토큰 발급")"
          NOTION_SYNC_STATUS="$(status_line "$NOTION_SYNC_OUTCOME" "프로젝트 이슈 노션 반영")"
          STEP_RESULTS="${GITHUB_APP_STATUS}"$'\n'"${NOTION_SYNC_STATUS}"

          jq -n \
            --arg title "$TITLE" \
            --arg stepResults "$STEP_RESULTS" \
            --argjson color "$COLOR" \
            '{
              username: "🔄 깃허브 노션 동기화",
              embeds: [{
                title: $title,
                color: $color,
                fields: [{
                  name: "⚙️ 실행 단계별 결과",
                  value: $stepResults,
                  inline: false
                }]
              }]
            }' > discord-payload.json

          curl --fail-with-body \
            --header "Content-Type: application/json" \
            --data @discord-payload.json \
            "$DISCORD_WEBHOOK_URL"
